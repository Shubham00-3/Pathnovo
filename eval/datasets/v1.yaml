version: 1
seed: 42
cases:
  - id: native_revision
    description: Controlled synthetic native revision pair
    pid_a: PID-SYN-A
    pid_b: PID-SYN-B
    mismatch_mode: warn
    expect_mismatch: false
    required: true
    ground_truth_path: data/samples/synthetic_native/ground_truth.json
    qa:
      - id: delta_setpoint
        question: What changed near 26-PIT-9062?
        must_include: ["250"]
        require_citation: true
        acceptable_source_prefixes: ["D:", "A:", "B:"]
      - id: duty_rev_b
        question: What is the duty value in the duty table of revision B?
        must_include: ["12500"]
        require_citation: true
        acceptable_source_prefixes: ["B:", "D:"]
      - id: high_conf
        question: Summarize only high-confidence changes.
        must_include: []
        require_citation: true
        acceptable_source_prefixes: ["D:"]
      - id: note_added
        question: Was NOTE 12 added between the revisions?
        must_include: ["NOTE 12"]
        require_citation: true
        acceptable_source_prefixes: ["D:", "B:"]
      - id: unsupported_unseen
        question: What is the approved paint color code for the skid package?
        unsupported: true
        must_include: []
        require_citation: false

      # Near-miss traps. The refusal questions here and below use vocabulary
      # absent from the corpus entirely ("paint", "hydrotest"), so retrieval
      # returns nothing and refusing is trivial. These use terms that ARE
      # present, attached to the wrong entity -- which is how a real user asks
      # something the drawing cannot answer. A system that pattern-matches on
      # keywords answers confidently and scores zero here.
      - id: trap_wrong_instrument_setpoint
        # "HH" and "26-PT-9070" both exist; the HH setpoint belongs to
        # 26-PIT-9062 and 26-PT-9070 has none.
        question: What is the HH setpoint for 26-PT-9070?
        unsupported: true
        must_include: []
        require_citation: false
      - id: trap_nonexistent_revision
        # "duty" and "revision" are both in the corpus. Revision C is not.
        question: What is the duty value in revision C?
        unsupported: true
        must_include: []
        require_citation: false
      - id: trap_other_document_equipment
        # "motor" is present; 26-KA-902 belongs to the export drawing, not this
        # pair. Reporting this pair's motor rating would be a real error.
        question: What is the motor rating for 26-KA-902?
        unsupported: true
        must_include: []
        require_citation: false
      - id: vendor_supported_if_present
        # "vendor" is not a blacklist word; without evidence this must refuse
        question: Did the motor vendor change?
        unsupported: true
        must_include: []
        require_citation: false
    retrieval:
      - query: "26-PIT-9062"
        expect_families: ["rev_a", "rev_b", "delta"]
        must_match_text: "26-PIT-9062"
      # A bare tag echoed back by a lexical + identifier retriever is close to
      # tautological. These require the retriever to reach the right record from
      # wording that does not contain the target string verbatim.
      - query: "what is the high-high alarm setpoint"
        expect_families: ["rev_a", "rev_b", "delta"]
        must_match_text: "HH"
      - query: "compressor throughput capacity"
        expect_families: ["rev_a", "rev_b", "delta"]
        must_match_text: "Duty"
      - query: "which note was added in the latest revision"
        expect_families: ["delta", "rev_b"]
        must_match_text: "NOTE 12"
      - query: "isolation valve on the new branch"
        expect_families: ["rev_b", "delta"]
        must_match_text: "HV-205"

  - id: scanned_revision
    description: Scanned variant of the synthetic pair
    pid_a: PID-SYN-SCAN-A
    pid_b: PID-SYN-SCAN-B
    mismatch_mode: warn
    expect_mismatch: false
    required: true
    requires_ocr: true
    ground_truth_path: data/samples/synthetic_scanned/ground_truth.json
    qa:
      - id: scan_duty
        question: What changed about the duty value?
        must_include: ["12500"]
        require_citation: true
        acceptable_source_prefixes: ["D:", "A:", "B:"]
      - id: scan_unsupported
        question: Who signed the hydraulic certification stamp?
        unsupported: true
        must_include: []
        require_citation: false

  - id: lift_export_mismatch
    description: Lift vs export pair mismatch (different underlying documents)
    pid_a: PID-LIFT
    pid_b: PID-EXPORT
    mismatch_mode: warn
    expect_mismatch: true
    required: true
    ground_truth_path: null
    qa:
      - id: mismatch_summary
        question: Summarize only high-confidence changes.
        must_include: []
        require_citation: true
        acceptable_source_prefixes: ["D:"]

  - id: native_revision_alt
    description: Independent export-gas native revision scenario
    pid_a: PID-SYN2-A
    pid_b: PID-SYN2-B
    mismatch_mode: warn
    expect_mismatch: false
    required: true
    ground_truth_path: data/samples/synthetic_secondary/ground_truth.json
    qa:
      - id: export_setpoint
        question: What changed near 27-PIT-1001?
        must_include: ["185"]
        require_citation: true
        acceptable_source_prefixes: ["D:", "A:", "B:"]
      - id: export_duty
        question: What is the duty value in revision B?
        must_include: ["8500"]
        require_citation: true
        acceptable_source_prefixes: ["B:", "D:"]

  # Third format. CAD carries exact vector coordinates, so this case isolates
  # delta quality from extraction error: any miss here is the matcher's fault,
  # not OCR's. Contrast with scanned_revision, which shares the same edit set.
  - id: cad_revision
    description: Synthetic DXF revision pair ingested through the CAD adapter
    pid_a: PID-CAD-A
    pid_b: PID-CAD-B
    mismatch_mode: warn
    expect_mismatch: false
    required: true
    requires_cad: true
    ground_truth_path: data/samples/synthetic_cad/ground_truth.json
    qa:
      - id: cad_setpoint
        question: What changed near 26-PIT-9080?
        must_include: ["195"]
        require_citation: true
        acceptable_source_prefixes: ["D:", "A:", "B:"]
      - id: cad_duty
        question: What is the duty value in revision B?
        must_include: ["8600"]
        require_citation: true
        acceptable_source_prefixes: ["B:", "D:"]
      - id: cad_note_added
        question: Was NOTE 12 added between the revisions?
        must_include: ["NOTE 12"]
        require_citation: true
        acceptable_source_prefixes: ["D:", "B:"]
      - id: cad_unsupported
        question: What is the hydrotest pressure for the discharge spool?
        must_include: []
        require_citation: false
        unsupported: true
    retrieval:
      - query: 26-PT-9085
        must_match_text: 26-PT-9085
        expect_families: [rev_a, rev_b, delta]
