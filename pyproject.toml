[project]
name = "delta-chat"
version = "0.1.0"
description = "Document delta engine with grounded chat over engineering drawing revisions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Applied AI Candidate" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pymupdf>=1.24",
  "pypdf>=4.2",
  "pdfplumber>=0.11",
  "opencv-python-headless>=4.9",
  "pytesseract>=0.3.10",
  "Pillow>=10.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "rapidfuzz>=3.9",
  "shapely>=2.0",
  "structlog>=24.1",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
llm = [
  "litellm>=1.40",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
delta-chat = "delta_chat.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_chat"]

[tool.hatch.build.targets.sdist]
include = ["src/delta_chat", "scripts", "config", "eval", "tests", "data/samples/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
pretty = true
warn_unused_ignores = true
packages = ["delta_chat"]
